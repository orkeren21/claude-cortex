name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  bats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats

      - name: Run installer-helpers and session-start-hook tests
        run: bats tests/test_installer_helpers.bats tests/test_session_start_hook.bats
